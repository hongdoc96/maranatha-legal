<!DOCTYPE html>

<head>

<meta name="description" content="마라나타 (Maranatha) 이용약관 및 개인정보처리방침">
<style>
:root{--sapphire:#1B3A6B;--gold:#D4A867;--navy:#0A1F4A;--bg:#fff;--surface:#F4F7FB;--text:#0A1F4A;--text2:#4A6FA5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:480px;width:100%;text-align:center}
.star{font-size:32px;color:var(--gold);margin-bottom:8px}

.sub{font-size:14px;color:var(--text2);margin-bottom:36px}
.links{display:flex;flex-direction:column;gap:12px}
a.link{display:block;padding:18px 24px;background:linear-gradient(135deg,rgba(27,58,107,.06),rgba(212,168,103,.05));border:1px solid rgba(27,58,107,.2);border-radius:16px;text-decoration:none;color:var(--sapphire);font-size:16px;font-weight:600;transition:background .15s}
a.link:hover{background:linear-gradient(135deg,rgba(27,58,107,.12),rgba(212,168,103,.1))}
a.link .d{display:block;font-size:13px;font-weight:400;color:var(--text2);margin-top:4px}
footer{margin-top:40px;font-size:12px;color:var(--text2)}
footer a{color:var(--sapphire);text-decoration:none}
</style>
</head>
<body>
<div class="card">

</div>
<footer>홍독 스튜디오 (Hongdoc Studio)<br><a href="mailto:hongdocstudio@gmail.com">hongdocstudio@gmail.com</a></footer>

</html>
